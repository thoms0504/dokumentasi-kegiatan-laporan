function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(err && err.message ? err.message : String(err)))[fn](...args);
  });
}

const KAT_LABEL = { dokumentasi: 'Dokumentasi', bukti: 'Bukti Dukung' };
/** File gambar/video → dokumentasi; dokumen (PDF, Word, Excel, dll.) → bukti dukung. */
function guessKategori(f) { return /^(image|video)\//.test(f.type) ? 'dokumentasi' : 'bukti'; }
function ic(name, size) {
  size = size || 18;
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
}
function hydrateIcons(root) {
  (root || document).querySelectorAll('i[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic, Number(el.dataset.s) || 18); });
}

function statusOf(p) { return p >= 100 ? 'Selesai' : (p > 0 ? 'Berjalan' : 'Belum Mulai'); }
function stClass(s) { return s === 'Selesai' ? 'st-selesai' : (s === 'Berjalan' ? 'st-jalan' : 'st-belum'); }
function barClass(p) { return p >= 100 ? 'p-done' : (p <= 0 ? 'p-zero' : ''); }
function badge(p) { const s = statusOf(p); return '<span class="badge ' + stClass(s) + '">' + s + '</span>'; }
function bar(p) { return '<div class="bar ' + barClass(p) + '"><span style="width:' + p + '%"></span></div>'; }
function progColor(p) { return p >= 100 ? '#10b981' : (p <= 0 ? '#94a3b8' : '#2563eb'); }

function fmtDate(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? Number(m[3]) + ' ' + BLN[Number(m[2]) - 1] + ' ' + m[1] : (s || '-');
}
function fmtDateTime(s) {
  const t = String(s || '').split(' ')[1];
  return fmtDate(s) + (t ? ', ' + t : '');
}
function fmtSize(b) {
  if (!b) return '';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b) + ' ' + u[i];
}
function monthName(b) { return BULAN[b - 1] || '-'; }
function folderLabel(k) { return String(k.folderPath || k.folderNama || '').split(' / ').join(' › '); }
function pathOf(k) { return k.tahun + ' › ' + monthName(k.bulan) + ' › ' + folderLabel(k); }

/* ---------- Pohon folder bertingkat ---------- */
function flattenFolders(list, depth, prefix, out) {
  out = out || []; depth = depth || 0;
  (list || []).forEach(f => {
    const path = prefix ? prefix + ' / ' + f.name : f.name;
    out.push({ id: f.id, name: f.name, url: f.url, depth: depth, path: path, node: f });
    flattenFolders(f.children, depth + 1, path, out);
  });
  return out;
}
function countFolders(list) { return flattenFolders(list).length; }
function descendantIds(node) {
  let ids = [node.id];
  (node.children || []).forEach(c => { ids = ids.concat(descendantIds(c)); });
  return ids;
}
/** Cari node folder di seluruh pohon (semua tahun/bulan). */
function findFolderNode(id) {
  for (const y of S.tree) for (const m of y.months) {
    const hit = flattenFolders(m.folders).find(f => f.id === id);
    if (hit) return hit.node;
  }
  return null;
}
/** ID folder + semua sub-foldernya (untuk filter & statistik). */
function folderScope(id) {
  const n = findFolderNode(id);
  return new Set(n ? descendantIds(n) : [id]);
}
function statsFor(ids) {
  const ks = S.data.filter(k => ids.has(k.folderId));
  return { n: ks.length, avg: ks.length ? Math.round(ks.reduce((a, k) => a + k.progres, 0) / ks.length) : 0 };
}
function findRec(id) { return S.data.find(k => k.id === id); }
function upsert(rec) {
  const i = S.data.findIndex(k => k.id === rec.id);
  if (i >= 0) S.data[i] = rec; else S.data.unshift(rec);
}
function byYear(list) { return S.year === 'all' ? list : list.filter(k => String(k.tahun) === String(S.year)); }
function getYearNode(t) { return S.tree.find(y => String(y.tahun) === String(t)); }
function getMonthNode(t, b) { const y = getYearNode(t); return y ? y.months.find(m => m.bulan === Number(b)) : null; }
function getFolders(t, b) { const m = getMonthNode(t, b); return m ? m.folders : []; }
function allYears() {
  const set = new Set([String(S.now.tahun)]);
  S.tree.forEach(y => set.add(String(y.tahun)));
  S.data.forEach(k => set.add(String(k.tahun)));
  return Array.from(set).sort((a, b) => b - a);
}

/* ---------------- UI feedback ---------------- */
function toast(msg, type) {
  type = type || 'ok';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(type === 'err' ? 'alert' : 'checkCircle', 18) + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, type === 'err' ? 6000 : 3200);
}
function setBtnBusy(btn, busy, text) {
  if (busy) {
    btn.dataset.html = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span> ' + esc(text || 'Memproses…');
  } else {
    btn.disabled = false;
    if (btn.dataset.html) btn.innerHTML = btn.dataset.html;
  }
}
function openModal(id) { $('#' + id).classList.add('open'); }
function closeModal(id) { $('#' + id).classList.remove('open'); }

function promptDialog(o) {
  return new Promise(resolve => {
    $('#pTitle').textContent = o.title || 'Masukkan data';
    $('#pHint').textContent = o.hint || '';
    $('#pLabel').textContent = o.label || 'Nama';
    const inp = $('#pInput');
    inp.type = o.type || 'text';
    inp.value = o.value == null ? '' : o.value;
    inp.placeholder = o.placeholder || '';
    $('#pSubmit').textContent = o.submit || 'Simpan';
    S._prompt = resolve;
    openModal('mPrompt');
    setTimeout(() => { inp.focus(); inp.select(); }, 60);
  });
}
function finishPrompt(val) {
  closeModal('mPrompt');
  if (S._prompt) { S._prompt(val); S._prompt = null; }
}
/**
 * opts.list        : daftar poin dampak (ditampilkan dalam kotak merah)
 * opts.requireText : teks yang wajib diketik ulang sebelum tombol aktif
 */
function confirmDialog(title, text, okText, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    $('#cTitle').textContent = title;
    $('#cText').textContent = text || '';
    $('#cOk').textContent = okText || 'Hapus';
    const list = $('#cList');
    list.classList.toggle('hidden', !(opts.list && opts.list.length));
    list.innerHTML = (opts.list || []).map(t => '<li>' + ic('alert', 14) + '<span>' + t + '</span></li>').join('');
    const wrap = $('#cTypeWrap'), inp = $('#cType'), ok = $('#cOk');
    const need = opts.requireText || '';
    wrap.classList.toggle('hidden', !need);
    inp.value = '';
    $('#cTypeLabel').innerHTML = 'Ketik <b>' + esc(need) + '</b> untuk konfirmasi';
    ok.disabled = !!need;
    inp.oninput = () => { ok.disabled = inp.value.trim() !== need; };
    inp.onkeydown = e => { if (e.key === 'Enter' && !ok.disabled) finishConfirm(true); };
    S._confirm = resolve;
    openModal('mConfirm');
    if (need) setTimeout(() => inp.focus(), 60);
  });
}
function finishConfirm(v) {
  closeModal('mConfirm');
  $('#cOk').disabled = false;
  if (S._confirm) { S._confirm(v); S._confirm = null; }
}

/* ---------------- Init ---------------- */
document.addEventListener('DOMContentLoaded', init);

async function init() {
  hydrateIcons(document);
  bindStatic();
  if (window.Chart) {
    Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
    Chart.defaults.color = '#64748b';
  }
  try {
    applyInitial(await api('getInitialData'));
    S.year = String(S.now.tahun);
    render();
    $('#loader').classList.add('hide');
  } catch (e) {
    $('#loaderText').innerHTML = '<b style="color:#ef4444">Gagal memuat data.</b><br>' + esc(e) +
      '<br><br>Pastikan fungsi <code>setup</code> sudah dijalankan dan Anda punya akses ke folder Drive.';
    document.querySelector('#loader .spinner').style.display = 'none';
  }
}

function applyInitial(d) {
  S.data = d.kegiatan || [];
  S.tree = d.tree || [];
  S.now = d.now;
  S.user = d.user;
  $('#lnkRoot').href = d.rootUrl;
  $('#lnkDb').href = d.dbUrl;
  $('#userEmail').textContent = d.user || 'Pengguna';
}

async function refreshAll() {
  const b = $('#btnRefresh');
  b.classList.add('spin');
  try {
    applyInitial(await api('getInitialData'));
    render();
    toast('Data diperbarui');
  } catch (e) { toast(e, 'err'); }
  b.classList.remove('spin');
}

function bindStatic() {
  $$('.nav-item[data-view], .bn-item[data-view]').forEach(a => a.addEventListener('click', () => setView(a.dataset.view)));
  // Navigasi bawah (HP)
  $('#bnMore').addEventListener('click', () => toggleSidebar(true));
  $('#bnFab').addEventListener('click', openQuick);
  $('#qNew').addEventListener('click', () => { closeModal('mQuick'); openForm(null); });
  $('#qPhoto').addEventListener('click', async () => {
    closeModal('mQuick');
    const shots = await openCamera('');
    if (!shots.length) return;
    openForm(null);
    addPending(shots, 'dokumentasi');
  });
  $('#btnMenu').addEventListener('click', () => toggleSidebar(true));
  $('#sidebarBackdrop').addEventListener('click', () => toggleSidebar(false));
  $('#yearFilter').addEventListener('change', e => { S.year = e.target.value; render(); });
  $('#btnRefresh').addEventListener('click', refreshAll);
  $('#btnNew').addEventListener('click', () => openForm(null));

  // Filter kegiatan
  $('#fSearch').addEventListener('input', e => { S.filters.q = e.target.value; renderKegiatan(); });
  $('#fBulan').addEventListener('change', e => { S.filters.bulan = e.target.value; renderKegiatan(); });
  $('#fStatus').addEventListener('change', e => { S.filters.status = e.target.value; renderKegiatan(); });
  $('#fFolder').addEventListener('change', e => { S.filters.folder = e.target.value; renderKegiatan(); });
  $('#btnReset').addEventListener('click', () => { S.filters = { q: '', bulan: '', status: '', folder: '' }; $('#fSearch').value = ''; renderKegiatan(); });

  // Explorer
  $('#btnAddYear').addEventListener('click', addYear);
  $('#btnAddFolder').addEventListener('click', async () => {
    const ex = S.explorer;
    if (!ex.tahun || !ex.bulan) return toast('Pilih tahun dan bulan terlebih dahulu', 'err');
    const cur = currentExplorerNode();
    const f = cur ? await addSubFolder(cur) : await addFolder(ex.tahun, ex.bulan);
    if (f) renderFolder();
  });

  // Modal umum
  $$('.modal [data-close]').forEach(b => b.addEventListener('click', () => {
    const m = b.closest('.modal');
    if (m.id === 'mPrompt') finishPrompt(null);
    else if (m.id === 'mConfirm') finishConfirm(false);
    else closeModal(m.id);
  }));
  $('#fPrompt').addEventListener('submit', e => { e.preventDefault(); finishPrompt($('#pInput').value.trim()); });
  $('#cOk').addEventListener('click', () => finishConfirm(true));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#mConfirm').classList.contains('open')) return finishConfirm(false);
    if ($('#mPrompt').classList.contains('open')) return finishPrompt(null);
    if ($('#mQuick').classList.contains('open')) return closeModal('mQuick');
    if ($('#mKegiatan').classList.contains('open')) return closeModal('mKegiatan');
    closeDrawer();
  });

  // Form kegiatan
  $('#fKegiatan').addEventListener('submit', submitForm);
  $('#kTahun').addEventListener('change', () => fillDest($('#kTahun').value, $('#kBulan').value, ''));
  $('#kBulan').addEventListener('change', () => fillDest($('#kTahun').value, $('#kBulan').value, ''));
  $('#kFolder').addEventListener('change', updatePathHint);
  $('#kNewFolder').addEventListener('click', async () => {
    const t = $('#kTahun').value, b = $('#kBulan').value;
    const f = await addFolder(t, b);
    if (f) fillDest(t, b, f.id);
  });
  $('#kNewSub').addEventListener('click', async () => {
    const t = $('#kTahun').value, b = $('#kBulan').value;
    const parent = findFolderNode($('#kFolder').value);
    if (!parent) return toast('Pilih folder induk terlebih dahulu', 'err');
    const f = await addSubFolder(parent);
    if (f) fillDest(t, b, f.id);
  });
  $('#kProg').addEventListener('input', () => setFormProg($('#kProg').value));
  $('#kQuick').innerHTML = [0, 25, 50, 75, 100].map(v => '<button type="button" data-v="' + v + '">' + v + '%</button>').join('');
  $('#kQuick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFormProg(b.dataset.v); });
  // Upload di form: kamera, dokumentasi, bukti dukung, drag & drop
  $('#kCam').addEventListener('click', async () => {
    const shots = await openCamera($('#kNama').value.trim() || 'Kegiatan baru');
    addPending(shots, 'dokumentasi');
  });
  $('#kDoc').addEventListener('click', () => pickFiles('#inDoc', files => addPending(files, 'dokumentasi')));
  $('#kBukti').addEventListener('click', () => pickFiles('#inBukti', files => addPending(files, 'bukti')));
  bindDrop($('#kZone'), files => addPending(files));
  bindCamera();
  bindRte();

  // Drawer
  $('[data-close-drawer]').addEventListener('click', closeDrawer);
}

/* ---------- Lapor cepat (tombol ＋ di navigasi bawah) ---------- */
function openQuick() {
  const list = S.data.filter(k => k.progres < 100)
    .sort((a, b) => String(b.diperbarui).localeCompare(String(a.diperbarui))).slice(0, 6);
  $('#qPick').innerHTML = list.length ? list.map(k =>
    '<div class="pick" data-id="' + esc(k.id) + '"><div class="mini-ic" style="color:' + progColor(k.progres) + '">' + ic('activity', 16) + '</div>' +
    '<div class="grow"><div class="t ellipsis">' + esc(k.kegiatan) + '</div><div class="s ellipsis">' + esc(folderLabel(k)) + ' · ' + fmtDate(k.tanggal) + '</div></div>' +
    '<b style="color:' + progColor(k.progres) + '">' + k.progres + '%</b></div>').join('')
    : emptyMini('Tidak ada kegiatan yang sedang berjalan.');
  $$('#qPick .pick').forEach(p => p.addEventListener('click', () => { closeModal('mQuick'); openDetail(p.dataset.id); }));
  openModal('mQuick');
}

/* ---------- Ingat folder & PIC laporan terakhir (per perangkat) ---------- */
function lastGet() { try { return JSON.parse(localStorage.getItem('dk_last') || 'null'); } catch (e) { return null; } }
function lastSet(v) { try { localStorage.setItem('dk_last', JSON.stringify(v)); } catch (e) { /* abaikan */ } }

function toggleSidebar(open) {
  $('#sidebar').classList.toggle('open', open);
  $('#sidebarBackdrop').classList.toggle('show', open);
}

function setView(v) {
  S.view = v;
  $$('.nav-item[data-view], .bn-item[data-view]').forEach(a => a.classList.toggle('active', a.dataset.view === v));
  window.scrollTo(0, 0);
  $$('.view').forEach(s => s.classList.toggle('hidden', s.id !== 'view-' + v));
  $('#pageTitle').textContent = VIEW_META[v][0];
  $('#pageSub').textContent = VIEW_META[v][1];
  $('#yearWrap').classList.toggle('hidden', v === 'folder');
  toggleSidebar(false);
  render();
}

function render() {
  renderYearFilter();
  $('#navCount').textContent = S.data.length;
  if (S.view === 'dashboard') renderDashboard();
  else if (S.view === 'kegiatan') renderKegiatan();
  else renderFolder();
}

function renderYearFilter() {
  const years = allYears();
  if (S.year !== 'all' && years.indexOf(String(S.year)) < 0) S.year = 'all';
  const short = window.matchMedia('(max-width: 640px)').matches;
  $('#yearFilter').innerHTML = '<option value="all">' + (short ? 'Semua' : 'Semua Tahun') + '</option>' +
    years.map(y => '<option value="' + y + '"' + (String(S.year) === y ? ' selected' : '') + '>' + (short ? '' : 'Tahun ') + y + '</option>').join('');
}

/* =====================================================================
 *  DASHBOARD
 * ===================================================================== */
function renderDashboard() {
  const L = byYear(S.data);
  const total = L.length;
  const done = L.filter(k => k.progres >= 100).length;
  const run = L.filter(k => k.progres > 0 && k.progres < 100).length;
  const todo = L.filter(k => k.progres <= 0).length;
  const avg = total ? Math.round(L.reduce((a, k) => a + k.progres, 0) / total) : 0;
  const files = L.reduce((a, k) => a + (k.jumlahFile || 0), 0);
  const pct = n => total ? Math.round(n / total * 100) + '% dari total' : '—';
  const yl = S.year === 'all' ? 'Semua tahun' : 'Tahun ' + S.year;

  const kpis = [
    { l: 'Total Kegiatan', v: total, s: files + ' file dokumentasi · ' + yl, i: 'list', t: 'blue' },
    { l: 'Selesai', v: done, s: pct(done), i: 'checkCircle', t: 'green' },
    { l: 'Sedang Berjalan', v: run, s: pct(run), i: 'activity', t: 'amber' },
    { l: 'Belum Mulai', v: todo, s: pct(todo), i: 'pause', t: 'slate' },
    { l: 'Rata-rata Progres', v: avg + '%', s: bar(avg), i: 'target', t: 'violet' }
  ];
  $('#kpis').innerHTML = kpis.map(k =>
    '<div class="card kpi tone-' + k.t + '"><div class="kpi-top"><span class="kpi-label">' + k.l + '</span><span class="kpi-ic">' + ic(k.i, 17) + '</span></div>' +
    '<div class="kpi-val">' + k.v + '</div><div class="kpi-sub">' + k.s + '</div></div>').join('');

  // Chart per bulan (stacked)
  const by = { 'Belum Mulai': Array(12).fill(0), 'Berjalan': Array(12).fill(0), 'Selesai': Array(12).fill(0) };
  L.forEach(k => { if (k.bulan >= 1 && k.bulan <= 12) by[statusOf(k.progres)][k.bulan - 1]++; });
  $('#chartBulanSub').textContent = 'Jumlah kegiatan berdasarkan status · ' + yl;
  drawChart('bulan', 'chartBulan', {
    type: 'bar',
    data: {
      labels: BLN,
      datasets: [
        { label: 'Selesai', data: by['Selesai'], backgroundColor: '#10b981', borderRadius: 4, maxBarThickness: 28 },
        { label: 'Berjalan', data: by['Berjalan'], backgroundColor: '#3b82f6', borderRadius: 4, maxBarThickness: 28 },
        { label: 'Belum Mulai', data: by['Belum Mulai'], backgroundColor: '#cbd5e1', borderRadius: 4, maxBarThickness: 28 }
      ]
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 18 } } },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eef2f7' }, border: { display: false } }
      }
    }
  });

  // Donut status
  $('#donutPct').textContent = total ? Math.round(done / total * 100) + '%' : '0%';
  drawChart('status', 'chartStatus', {
    type: 'doughnut',
    data: {
      labels: ['Selesai', 'Berjalan', 'Belum Mulai'],
      datasets: [{ data: total ? [done, run, todo] : [0, 0, 1], backgroundColor: total ? ['#10b981', '#3b82f6', '#cbd5e1'] : ['#eef2f7'], borderWidth: 0, hoverOffset: 4 }]
    },
    options: {
      maintainAspectRatio: false, cutout: '72%',
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 14 } }, tooltip: { enabled: total > 0 } }
    }
  });

  // Progres per folder
  const groups = {};
  L.forEach(k => {
    const key = k.folderId;
    if (!groups[key]) groups[key] = { name: folderLabel(k), sub: BLN[k.bulan - 1] + ' ' + k.tahun, n: 0, sum: 0, id: k.folderId };
    groups[key].n++; groups[key].sum += k.progres;
  });
  const gl = Object.values(groups).sort((a, b) => b.n - a.n).slice(0, 6);
  $('#folderProgress').innerHTML = gl.length ? gl.map(g => {
    const a = Math.round(g.sum / g.n);
    return '<div class="fp-row mini-item" data-folder="' + esc(g.id) + '" style="display:block"><div class="top"><span class="ellipsis"><b>' + esc(g.name) + '</b> <span class="muted">· ' + g.sub + ' · ' + g.n + ' kegiatan</span></span><b>' + a + '%</b></div>' + bar(a) + '</div>';
  }).join('') : emptyMini('Belum ada data folder');

  // Perlu perhatian
  const today = S.now.tanggal;
  const att = L.filter(k => k.progres < 100).sort((a, b) => a.progres - b.progres || String(a.tanggal).localeCompare(String(b.tanggal))).slice(0, 5);
  $('#attention').innerHTML = att.length ? att.map(k => {
    const late = k.tanggal && k.tanggal < today;
    return '<div class="mini-item" data-id="' + esc(k.id) + '"><div class="mini-ic" style="color:' + progColor(k.progres) + '">' + ic('clock', 16) + '</div>' +
      '<div class="grow"><div class="t ellipsis">' + esc(k.kegiatan) + '</div><div class="s ellipsis">' + esc(k.folderNama) + ' · ' + fmtDate(k.tanggal) + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:6px">' + bar(k.progres) + '<small style="font-weight:600">' + k.progres + '%</small></div></div>' +
      (late ? '<span class="tag">Lewat tgl</span>' : '') + '</div>';
  }).join('') : emptyMini('Semua kegiatan sudah selesai 🎉');

  // Aktivitas terbaru
  const rec = L.slice().sort((a, b) => String(b.diperbarui).localeCompare(String(a.diperbarui))).slice(0, 6);
  $('#recent').innerHTML = rec.length ? rec.map(k =>
    '<div class="mini-item" data-id="' + esc(k.id) + '"><div class="mini-ic">' + ic('file', 16) + '</div>' +
    '<div class="grow"><div class="t ellipsis">' + esc(k.kegiatan) + '</div><div class="s">' + fmtDateTime(k.diperbarui) + '</div></div>' + badge(k.progres) + '</div>'
  ).join('') : emptyMini('Belum ada aktivitas');

  $$('#view-dashboard [data-id]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
  $$('#view-dashboard [data-folder]').forEach(el => el.addEventListener('click', () => {
    S.filters = { q: '', bulan: '', status: '', folder: el.dataset.folder };
    $('#fSearch').value = '';
    setView('kegiatan');
  }));
}

function emptyMini(t) { return '<div class="empty-mini">' + esc(t) + '</div>'; }

function drawChart(key, id, cfg) {
  if (!window.Chart) return;
  if (S.charts[key]) S.charts[key].destroy();
  S.charts[key] = new Chart(document.getElementById(id), cfg);
}

/* =====================================================================
 *  DAFTAR KEGIATAN
 * ===================================================================== */
function renderKegiatan() {
  const base = byYear(S.data);
  const f = S.filters;

  $('#fBulan').innerHTML = '<option value="">Semua Bulan</option>' + BULAN.map((b, i) => '<option value="' + (i + 1) + '"' + (String(f.bulan) === String(i + 1) ? ' selected' : '') + '>' + b + '</option>').join('');
  $('#fStatus').innerHTML = '<option value="">Semua Status</option>' + ['Belum Mulai', 'Berjalan', 'Selesai'].map(s => '<option' + (f.status === s ? ' selected' : '') + '>' + s + '</option>').join('');
  const folders = {};
  base.forEach(k => { folders[k.folderId] = folderLabel(k) + ' (' + BLN[k.bulan - 1] + ' ' + k.tahun + ')'; });
  if (f.folder && !folders[f.folder]) {
    const r = S.data.find(k => k.folderId === f.folder);
    const node = findFolderNode(f.folder);
    if (r) folders[f.folder] = folderLabel(r) + ' (' + BLN[r.bulan - 1] + ' ' + r.tahun + ')';
    else if (node) folders[f.folder] = node.name + ' (termasuk sub-folder)';
  }
  $('#fFolder').innerHTML = '<option value="">Semua Folder</option>' + Object.keys(folders).sort((a, b) => folders[a].localeCompare(folders[b])).map(id => '<option value="' + esc(id) + '"' + (f.folder === id ? ' selected' : '') + '>' + esc(folders[id]) + '</option>').join('');

  const q = f.q.trim().toLowerCase();
  const scope = f.folder ? folderScope(f.folder) : null; // folder terpilih + semua sub-foldernya
  const list = (scope ? S.data.filter(k => scope.has(k.folderId)) : base).filter(k =>
    (!q || (k.kegiatan + ' ' + stripHtml(k.isi) + ' ' + k.pic + ' ' + (k.folderPath || k.folderNama)).toLowerCase().indexOf(q) >= 0) &&
    (!f.bulan || String(k.bulan) === String(f.bulan)) &&
    (!f.status || statusOf(k.progres) === f.status)
  ).sort((a, b) => String(b.tanggal || b.dibuat).localeCompare(String(a.tanggal || a.dibuat)));

  $('#kSummary').innerHTML = 'Menampilkan <b style="color:var(--text)">' + list.length + '</b> dari ' + base.length + ' kegiatan' + (S.year === 'all' ? '' : ' pada tahun ' + S.year);

  if (!list.length) {
    $('#kList').innerHTML = '<div class="empty"><div class="empty-ic">' + ic('list', 24) + '</div><h4>' + (base.length ? 'Tidak ada kegiatan yang cocok' : 'Belum ada kegiatan') + '</h4>' +
      '<p>' + (base.length ? 'Coba ubah kata kunci atau filter.' : 'Mulai dokumentasikan kegiatan kantor pertama Anda.') + '</p>' +
      '<button class="btn primary" onclick="openForm(null)">' + ic('plus', 16) + 'Kegiatan Baru</button></div>';
    return;
  }

  $('#kList').innerHTML = list.map(k => {
    const prev = stripHtml(k.isi).replace(/\s+/g, ' ').slice(0, 110);
    return '<div class="k-row" data-id="' + esc(k.id) + '">' +
      '<div class="k-main"><div class="k-title ellipsis">' + esc(k.kegiatan) + '</div><div class="k-sub ellipsis">' + (esc(prev) || '<i>Tidak ada isi</i>') + '</div></div>' +
      '<div class="k-folder"><span class="chip" title="' + esc(folderLabel(k)) + '">' + ic('folder', 14) + '<span>' + esc(folderLabel(k)) + '</span></span><small>' + monthName(k.bulan) + ' ' + k.tahun + '</small></div>' +
      '<div class="k-meta"><div>' + ic('calendar', 14) + fmtDate(k.tanggal) + '</div><small class="ellipsis">' + ic('user', 13) + esc(k.pic || '-') + '</small></div>' +
      '<div class="k-prog">' + bar(k.progres) + '<b>' + k.progres + '%</b></div>' +
      '<div>' + badge(k.progres) + '</div></div>';
  }).join('');
  $$('#kList .k-row').forEach(r => r.addEventListener('click', () => openDetail(r.dataset.id)));
}

/* =====================================================================
 *  FOLDER EXPLORER
 * ===================================================================== */
function renderFolder() {
  const ex = S.explorer;
  if (!ex.tahun || !getYearNode(ex.tahun)) ex.tahun = S.tree.length ? String(S.tree[0].tahun) : null;
  if (ex.tahun && ex.bulan && !getMonthNode(ex.tahun, ex.bulan)) ex.bulan = null;
  if (ex.tahun && !ex.bulan) {
    const y = getYearNode(ex.tahun);
    const cur = y.months.find(m => m.bulan === S.now.bulan && String(ex.tahun) === String(S.now.tahun));
    ex.bulan = cur ? cur.bulan : (y.months.length ? y.months[y.months.length - 1].bulan : null);
  }

  // Tahun
  $('#colYear').innerHTML = S.tree.length ? S.tree.map(y => {
    const n = y.months.reduce((a, m) => a + countFolders(m.folders), 0);
    return '<div class="ex-item' + (String(y.tahun) === String(ex.tahun) ? ' active' : '') + '" data-y="' + y.tahun + '"><span class="ex-ic">' + ic('folder', 18) + '</span><div class="grow">' + y.tahun + '<br><small>' + y.months.length + ' bulan · ' + n + ' folder</small></div>' +
      '<button class="ex-del" data-del-folder="' + esc(y.id) + '" title="Hapus folder tahun ' + y.tahun + '">' + ic('trash', 14) + '</button>' + ic('chev', 14) + '</div>';
  }).join('') : emptyMini('Belum ada folder tahun. Klik “+ Tahun”.');
  $$('#colYear [data-y]').forEach(el => el.addEventListener('click', () => { ex.tahun = el.dataset.y; ex.bulan = null; ex.path = []; renderFolder(); }));

  // Bulan (12 bulan; yang belum ada bisa dibuat langsung)
  if (!ex.tahun) {
    $('#colMonth').innerHTML = emptyMini('Pilih atau buat tahun terlebih dahulu');
  } else {
    $('#colMonth').innerHTML = BULAN.map((nm, i) => {
      const b = i + 1, m = getMonthNode(ex.tahun, b);
      if (m) return '<div class="ex-item' + (ex.bulan === b ? ' active' : '') + '" data-m="' + b + '"><span class="ex-ic">' + ic('folder', 18) + '</span><div class="grow">' + esc(m.name) + '<br><small>' + countFolders(m.folders) + ' folder</small></div>' +
        '<button class="ex-del" data-del-folder="' + esc(m.id) + '" title="Hapus folder ' + esc(m.name) + '">' + ic('trash', 14) + '</button>' + ic('chev', 14) + '</div>';
      return '<div class="ex-item ghosted" data-new-m="' + b + '"><span class="ex-ic">' + ic('folder', 18) + '</span><div class="grow">' + ('0' + b).slice(-2) + ' - ' + nm + '<br><small>Belum dibuat</small></div><span class="add">+ Buat</span></div>';
    }).join('');
    $$('#colMonth [data-m]').forEach(el => el.addEventListener('click', () => { ex.bulan = Number(el.dataset.m); ex.path = []; renderFolder(); }));
    $$('#colMonth [data-new-m]').forEach(el => el.addEventListener('click', async () => {
      const b = Number(el.dataset.newM);
      el.querySelector('.add').innerHTML = '<span class="spinner sm"></span>';
      el.querySelector('.add').style.opacity = 1;
      try {
        const res = await api('createMonth', Number(ex.tahun), b);
        S.tree = res.tree; ex.bulan = b; ex.path = []; renderFolder();
        toast('Folder bulan ' + monthName(b) + ' ' + ex.tahun + ' dibuat');
      } catch (e) { toast(e, 'err'); renderFolder(); }
    }));
  }

  // Folder kegiatan (bertingkat): ex.path = [id folder kegiatan, id sub-folder, ...]
  const mNode = ex.tahun && ex.bulan ? getMonthNode(ex.tahun, ex.bulan) : null;
  const trail = explorerTrail(mNode);
  const cur = trail.length ? trail[trail.length - 1] : null;
  const children = cur ? (cur.children || []) : (mNode ? mNode.folders : []);
  const depth = trail.length; // 0 = level bulan

  $('#colFolderTitle').textContent = cur ? 'Sub-folder' : 'Folder Kegiatan';
  $('#btnAddFolder').disabled = !mNode || depth >= 8;
  $('#btnAddFolderLabel').textContent = cur ? 'Sub-folder Baru' : 'Folder Baru';

  let html = '';
  if (!mNode) {
    html = emptyMini('Pilih bulan untuk melihat folder kegiatan');
  } else {
    // Navigasi di dalam folder
    if (cur) {
      html += '<div class="sub-nav"><button class="icon-btn sm" id="exBack" title="Kembali">' + ic('chev', 16) + '</button><div class="sub-crumbs">' +
        '<a data-go="-1">' + esc(mNode.name) + '</a>' +
        trail.map((n, i) => ic('chev', 12) + (i === trail.length - 1 ? '<b>' + esc(n.name) + '</b>' : '<a data-go="' + i + '">' + esc(n.name) + '</a>')).join('') +
        '</div></div>';
      const st = statsFor(new Set(descendantIds(cur)));
      const direct = S.data.filter(k => k.folderId === cur.id).length;
      html += '<div class="cur-folder"><div class="fcard-ic">' + ic('folder', 20) + '</div><div class="grow"><div class="fcard-name">' + esc(cur.name) + '</div>' +
        '<small class="muted">' + direct + ' kegiatan di folder ini · ' + st.n + ' termasuk sub-folder · ' + (cur.children || []).length + ' sub-folder</small>' +
        '<div class="fcard-stats" style="margin-top:8px">' + bar(st.avg) + '<b style="color:var(--text)">' + st.avg + '%</b></div></div>' +
        '<div class="fcard-actions"><button class="btn primary sm" data-add="' + esc(cur.id) + '">' + ic('plus', 13) + 'Kegiatan di sini</button>' +
        '<button class="btn ghost sm" data-see="' + esc(cur.id) + '">Lihat Kegiatan</button>' +
        '<a class="btn ghost sm" href="' + esc(cur.url) + '" target="_blank" rel="noopener" title="Buka di Drive">' + ic('external', 13) + '</a>' +
        '<button class="btn ghost sm del icon-only" data-del-folder="' + esc(cur.id) + '" title="Hapus folder ini">' + ic('trash', 13) + '</button></div></div>';
    }

    if (!children.length) {
      html += '<div class="empty" style="padding:40px 20px"><div class="empty-ic">' + ic('folder', 24) + '</div>' +
        '<h4>' + (cur ? 'Belum ada sub-folder' : 'Belum ada folder') + '</h4>' +
        '<p>' + (cur ? 'Buat sub-folder untuk memecah “' + esc(cur.name) + '” (mis. per sesi, per hari, per lokasi).' : 'Buat folder untuk mengelompokkan kegiatan di ' + monthName(ex.bulan) + ' ' + ex.tahun + '.') + '</p>' +
        (depth < 8 ? '<button class="btn primary" id="emptyAddFolder">' + ic('plus', 16) + (cur ? 'Sub-folder Baru' : 'Folder Baru') + '</button>' : '') + '</div>';
    } else {
      html += '<div class="folder-grid">' + children.map(f => {
        const st = statsFor(new Set(descendantIds(f)));
        const subs = (f.children || []).length;
        return '<div class="fcard"><div class="fcard-top" data-open="' + esc(f.id) + '" title="Buka folder"><div class="fcard-ic">' + ic('folder', 20) + '</div><div style="min-width:0;flex:1"><div class="fcard-name ellipsis" title="' + esc(f.name) + '">' + esc(f.name) + '</div>' +
          '<small class="muted">' + st.n + ' kegiatan' + (subs ? ' · ' + subs + ' sub-folder' : '') + '</small></div>' + ic('chev', 15) + '</div>' +
          '<div class="fcard-stats">' + bar(st.avg) + '<b style="color:var(--text)">' + st.avg + '%</b></div>' +
          '<div class="fcard-actions"><button class="btn primary sm" data-add="' + esc(f.id) + '">' + ic('plus', 13) + 'Kegiatan</button>' +
          (depth + 1 < 8 ? '<button class="btn ghost sm" data-sub="' + esc(f.id) + '" title="Tambah sub-folder di dalam folder ini">' + ic('plus', 13) + 'Sub-folder</button>' : '') +
          '<button class="btn ghost sm" data-see="' + esc(f.id) + '">Lihat</button>' +
          '<a class="btn ghost sm" href="' + esc(f.url) + '" target="_blank" rel="noopener" title="Buka di Drive">' + ic('external', 13) + '</a>' +
          '<button class="btn ghost sm del icon-only" data-del-folder="' + esc(f.id) + '" title="Hapus folder">' + ic('trash', 13) + '</button></div></div>';
      }).join('') + '</div>';
    }
  }
  $('#colFolder').innerHTML = html;

  const empty = $('#emptyAddFolder'); if (empty) empty.addEventListener('click', () => $('#btnAddFolder').click());
  const back = $('#exBack'); if (back) back.addEventListener('click', () => { ex.path.pop(); renderFolder(); });
  $$('#colFolder [data-go]').forEach(a => a.addEventListener('click', () => { ex.path = ex.path.slice(0, Number(a.dataset.go) + 1); renderFolder(); }));
  $$('#colFolder [data-open]').forEach(el => el.addEventListener('click', () => { ex.path = trail.map(n => n.id).concat(el.dataset.open); renderFolder(); }));
  $$('#colFolder [data-sub]').forEach(b => b.addEventListener('click', async () => {
    const node = children.find(c => c.id === b.dataset.sub);
    const f = await addSubFolder(node);
    if (f) { ex.path = trail.map(n => n.id).concat(node.id); renderFolder(); }
  }));
  $$('#colFolder [data-add]').forEach(b => b.addEventListener('click', () => openForm(null, { tahun: ex.tahun, bulan: ex.bulan, folderId: b.dataset.add })));
  $$('#colFolder [data-see]').forEach(b => b.addEventListener('click', () => {
    S.filters = { q: '', bulan: '', status: '', folder: b.dataset.see };
    $('#fSearch').value = '';
    setView('kegiatan');
  }));

  // Hapus folder (semua level)
  $$('#view-folder [data-del-folder]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    deleteFolderFlow(b.dataset.delFolder);
  }));

  // Breadcrumb utama
  const root = $('#lnkRoot').href;
  const yNode = ex.tahun ? getYearNode(ex.tahun) : null;
  let crumb = ic('folder', 15) + '<span>Dokumentasi</span>';
  if (yNode) crumb += ic('chev', 13) + '<span>' + yNode.tahun + '</span>';
  if (mNode) crumb += ic('chev', 13) + (trail.length ? '<span>' + esc(mNode.name) + '</span>' : '<b>' + esc(mNode.name) + '</b>');
  trail.forEach((n, i) => { crumb += ic('chev', 13) + (i === trail.length - 1 ? '<b>' + esc(n.name) + '</b>' : '<span>' + esc(n.name) + '</span>'); });
  $('#crumbs').innerHTML = crumb;
  $('#lnkCurrent').href = cur ? cur.url : (mNode ? mNode.url : (yNode ? yNode.url : root));
}

/** Ubah ex.path (daftar id) menjadi daftar node; potong bila ada folder yang sudah tidak ada. */
function explorerTrail(mNode) {
  const ex = S.explorer;
  ex.path = ex.path || [];
  const trail = [];
  let level = mNode ? mNode.folders : [];
  for (const id of ex.path) {
    const n = (level || []).find(f => f.id === id);
    if (!n) break;
    trail.push(n);
    level = n.children;
  }
  ex.path = trail.map(n => n.id);
  return trail;
}
function currentExplorerNode() {
  const ex = S.explorer;
  const m = ex.tahun && ex.bulan ? getMonthNode(ex.tahun, ex.bulan) : null;
  const t = explorerTrail(m);
  return t.length ? t[t.length - 1] : null;
}

/* ---------- Hapus folder ---------- */
/** Cari folder (tahun / bulan / folder / sub-folder) di pohon beserta info dampaknya. */
function folderDeleteInfo(id) {
  for (const y of S.tree) {
    if (y.id === id) {
      const all = y.months.reduce((a, m) => a.concat(flattenFolders(m.folders)), []);
      return { level: 'tahun', label: 'folder tahun', name: y.tahun, months: y.months.length, folders: all.length, ids: new Set(all.map(f => f.id)) };
    }
    for (const m of y.months) {
      if (m.id === id) {
        const all = flattenFolders(m.folders);
        return { level: 'bulan', label: 'folder bulan', name: m.name, path: y.tahun + ' › ' + m.name, folders: all.length, ids: new Set(all.map(f => f.id)) };
      }
      const hit = flattenFolders(m.folders).find(f => f.id === id);
      if (hit) {
        const ids = new Set(descendantIds(hit.node));
        return { level: 'folder', label: hit.depth ? 'sub-folder' : 'folder kegiatan', name: hit.name,
          path: y.tahun + ' › ' + m.name + ' › ' + hit.path.split(' / ').join(' › '), folders: ids.size - 1, ids: ids };
      }
    }
  }
  return null;
}

async function deleteFolderFlow(id) {
  const info = folderDeleteInfo(id);
  if (!info) return toast('Folder tidak ditemukan. Coba muat ulang data.', 'err');
  const nKeg = S.data.filter(k => info.ids.has(k.folderId)).length;

  const list = [];
  if (info.level === 'tahun') list.push('<b>' + info.months + ' folder bulan</b> dan <b>' + info.folders + ' folder kegiatan/sub-folder</b> di dalamnya ikut terhapus.');
  else if (info.folders) list.push('<b>' + info.folders + ' ' + (info.level === 'bulan' ? 'folder kegiatan/sub-folder' : 'sub-folder') + '</b> di dalamnya ikut terhapus.');
  if (nKeg) list.push('<b>' + nKeg + ' kegiatan</b> beserta laporan PDF, dokumentasi, dan bukti dukungnya akan dihapus dari aplikasi.');
  list.push('Folder dipindahkan ke <b>Sampah Google Drive</b> dan masih bisa dipulihkan dari sana ±30 hari.');

  // Konfirmasi ketik-nama untuk penghapusan besar
  const big = info.level !== 'folder' || nKeg > 0 || info.folders > 0;
  const ok = await confirmDialog(
    'Hapus ' + info.label + ' “' + info.name + '”?',
    info.path ? 'Lokasi: ' + info.path : 'Folder tahun ' + info.name + ' beserta seluruh isinya.',
    'Hapus Folder',
    { list: list, requireText: big ? String(info.name) : '' }
  );
  if (!ok) return;

  try {
    toast('Menghapus “' + info.name + '”…');
    const res = await api('deleteFolder', id);
    S.tree = res.tree;
    const gone = new Set(res.removedIds);
    S.data = S.data.filter(k => !gone.has(k.id));
    if (S.detail && gone.has(S.detail.record.id)) closeDrawer();
    if (S.filters.folder && info.ids.has(S.filters.folder) || S.filters.folder === id) S.filters.folder = '';
    // Atur ulang posisi explorer bila folder yang sedang dibuka ikut terhapus
    const ex = S.explorer;
    if (info.level === 'tahun' && String(ex.tahun) === String(info.name)) { ex.tahun = null; ex.bulan = null; ex.path = []; }
    if (info.level === 'bulan' && ex.path.length === 0 && getMonthNode(ex.tahun, ex.bulan) == null) { ex.bulan = null; }
    if (info.level === 'folder') { const i = ex.path.indexOf(id); if (i >= 0) ex.path = ex.path.slice(0, i); }
    render();
    toast('“' + info.name + '” dipindahkan ke Sampah' + (res.removedIds.length ? ' · ' + res.removedIds.length + ' kegiatan dihapus' : ''));
  } catch (e) { toast(e, 'err'); }
}

/**
 * Panggil fungsi server yang menyusun PDF lalu kembalikan detail terbaru.
 * (Fungsi PDF di server bersifat async; bila nilai baliknya tidak terkirim,
 * detail diambil ulang dengan getDetail.)
 */
async function apiDetail(fn, id, ...args) {
  let d = null;
  try { d = await api(fn, id, ...args); } catch (e) { throw e; }
  if (!d || !d.record) d = await api('getDetail', id);
  if (d && d.record) upsert(d.record);
  return d;
}

/**
 * Unggah antrean {file, kategori}:
 * • FOTO → dikompres lalu dikirim LANGSUNG ke laporan PDF (tidak disimpan di Drive),
 *   dalam beberapa kelompok agar tiap pengiriman tidak terlalu besar.
 * • Dokumen & video → disimpan di folder kegiatan / "Bukti Dukung".
 * onStep(i, total, name) untuk progres. built=true bila PDF sudah tersusun ulang.
 */
const FOTO_BATCH_BYTES = 6 * 1024 * 1024;
async function uploadItems(id, items, onStep) {
  let ok = 0, built = false, step = 0;
  const total = items.length;
  const isPhoto = it => /^image\//i.test(it.file.type) && !/heic|heif/i.test(it.file.type);
  const docs = items.filter(it => !isPhoto(it)), photos = items.filter(isPhoto);

  for (const it of docs) {
    if (onStep) onStep(step++, total, it.file.name);
    try { const res = await api('uploadDokumentasi', id, await fileToPayload(it.file, it.kategori)); upsert(res.record); ok++; }
    catch (e) { toast(it.file.name + ': ' + e, 'err'); }
  }

  let batch = [], size = 0;
  const flush = async () => {
    if (!batch.length) return;
    const send = batch; batch = []; size = 0;
    if (onStep) onStep(Math.min(step, total - 1), total, 'menyusun ' + send.length + ' foto ke laporan PDF');
    try {
      await apiDetail('tambahFotoLaporan', id, send.map(p => ({ name: p.name, data: p.data, mimeType: p.mimeType, kategori: p.kategori })));
      ok += send.length; built = true;
    } catch (e) { toast('Foto gagal masuk ke PDF: ' + e, 'err'); }
  };
  for (const it of photos) {
    if (onStep) onStep(step++, total, it.file.name);
    const p = await fileToPayload(it.file, it.kategori);
    if (size + p.data.length > FOTO_BATCH_BYTES) await flush();
    batch.push(p); size += p.data.length;
  }
  await flush();
  return { ok: ok, built: built };
}

async function fileToPayload(f, kategori) {
  kategori = kategori || guessKategori(f);
  f = await shrinkImage(f);
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ name: f.name, mimeType: f.type || 'application/octet-stream', data: String(r.result).split(',')[1], kategori: kategori });
    r.onerror = () => reject('Gagal membaca file ' + f.name);
    r.readAsDataURL(f);
  });
}

/**
 * Hemat kuota Drive: setiap foto (> 300 KB) dikompres di perangkat ke sisi
 * terpanjang 1280 px (JPEG ±150–300 KB) sebelum diunggah. Ukuran ini sudah
 * tajam untuk laporan PDF A4, unggahan lebih cepat, dan orientasi foto HP benar.
 */
const SHRINK_MIN_BYTES = 300 * 1024, SHRINK_MAX_PX = 1280, SHRINK_QUALITY = 0.8;
function shrinkImage(f) {
  return new Promise(resolve => {
    // Semua foto dijadikan JPEG (format yang ditanam ke PDF); JPEG kecil dibiarkan apa adanya
    if (!/^image\/(jpeg|png|webp|gif|bmp)$/i.test(f.type) || (/jpeg/i.test(f.type) && f.size < SHRINK_MIN_BYTES)) return resolve(f);
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const s = Math.min(1, SHRINK_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); // PNG transparan → latar putih
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => {
        if (!b || (b.size >= f.size && /jpeg/i.test(f.type))) return resolve(f);
        resolve(new File([b], f.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg', lastModified: Date.now() }));
      }, 'image/jpeg', SHRINK_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(f); };
    img.src = url;
  });
}

/* =====================================================================
 *  EDITOR WYSIWYG (Isi Kegiatan)
 * ===================================================================== */
const RICH_OK = { P: 1, BR: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, STRIKE: 1, UL: 1, OL: 1, LI: 1,
  H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1, A: 1, DIV: 1, SPAN: 1, HR: 1, SUB: 1, SUP: 1 };
const RICH_MAP = { H1: 'H2', H5: 'H4', H6: 'H4', STRIKE: 'S', SECTION: 'DIV', ARTICLE: 'DIV', TD: 'SPAN', TH: 'SPAN', TR: 'DIV', PRE: 'P' };
const RICH_DROP = { SCRIPT: 1, STYLE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, SVG: 1, MATH: 1, TEMPLATE: 1, NOSCRIPT: 1, HEAD: 1, TITLE: 1, META: 1, LINK: 1, IMG: 1, VIDEO: 1, AUDIO: 1, CANVAS: 1, FORM: 1, INPUT: 1, BUTTON: 1, SELECT: 1, TEXTAREA: 1 };

/** Bersihkan HTML (ketikan / tempelan dari Word, web, dll.) → hanya format yang didukung laporan. */
function cleanRich(html) {
  const doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  const walk = (src, dst) => {
    src.childNodes.forEach(n => {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1 || RICH_DROP[n.tagName]) return;
      let tag = RICH_MAP[n.tagName] || n.tagName;
      // Format inline dari style (mis. hasil tempel Google Docs)
      const st = n.getAttribute('style') || '';
      if (tag === 'SPAN') {
        let el = null, inner = null;
        const wrap = t => { const e = document.createElement(t); if (inner) inner.appendChild(e); else el = e; inner = e; };
        if (/font-weight\s*:\s*(bold|[6-9]00)/i.test(st)) wrap('b');
        if (/font-style\s*:\s*italic/i.test(st)) wrap('i');
        if (/text-decoration[^;]*underline/i.test(st)) wrap('u');
        if (el) { walk(n, inner); dst.appendChild(el); } else walk(n, dst);
        return;
      }
      if (!RICH_OK[tag]) { walk(n, dst); return; }
      const out = document.createElement(tag.toLowerCase());
      if (tag === 'A') {
        const h = n.getAttribute('href') || '';
        if (/^(https?:|mailto:)/i.test(h)) { out.setAttribute('href', h); out.setAttribute('target', '_blank'); }
      }
      const al = (st.match(/text-align\s*:\s*(left|center|right|justify)/i) || [])[1] || n.getAttribute('align');
      if (al && /^(P|H2|H3|H4|DIV|LI|BLOCKQUOTE)$/.test(tag) && /^(left|center|right|justify)$/i.test(al)) out.style.textAlign = al.toLowerCase();
      walk(n, out);
      dst.appendChild(out);
    });
  };
  const raw = document.createElement('div');
  walk(doc.body.firstChild, raw);
  // Teks lepas di tingkat atas → bungkus jadi paragraf agar rapi di PDF
  const box = document.createElement('div');
  let para = null;
  Array.from(raw.childNodes).forEach(n => {
    const block = n.nodeType === 1 && /^(P|UL|OL|H2|H3|H4|BLOCKQUOTE|DIV|HR)$/.test(n.tagName);
    if (block) { para = null; box.appendChild(n); return; }
    if (n.nodeType === 1 && n.tagName === 'BR' && para) { para = null; return; }
    if (!para) { para = document.createElement('p'); box.appendChild(para); }
    para.appendChild(n);
  });
  Array.from(box.querySelectorAll('p')).forEach(p => { if (!p.textContent.trim() && !p.querySelector('br')) p.remove(); });
  const text = box.textContent.replace(/ /g, ' ').trim();
  return text ? box.innerHTML : '';
}

/** Isi lama (teks biasa) → paragraf; isi HTML → dibersihkan. */
function toRich(s) {
  s = String(s || '');
  if (!s) return '';
  if (/<\/?(p|br|b|strong|i|em|u|s|ul|ol|li|h[2-4]|blockquote|div)\b/i.test(s)) return cleanRich(s);
  return s.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
}
function stripHtml(s) {
  s = String(s || '');
  if (s.indexOf('<') < 0) return s;
  const d = new DOMParser().parseFromString(s.replace(/<(br|\/p|\/li|\/h[2-4]|\/div)[^>]*>/gi, '$& '), 'text/html');
  return (d.body.textContent || '').replace(/\s+/g, ' ').trim();
}

function rteExec(cmd, val) {
  $('#kIsi').focus();
  document.execCommand(cmd, false, val == null ? null : val);
  updateRteState();
}
function currentBlock() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return '';
  let n = sel.anchorNode;
  const ed = $('#kIsi');
  while (n && n !== ed) {
    if (n.nodeType === 1 && /^(H2|H3|H4|BLOCKQUOTE|P|LI)$/.test(n.tagName)) return n.tagName.toLowerCase();
    n = n.parentNode;
  }
  return '';
}
function updateRteState() {
  const ed = $('#kIsi');
  const sel = window.getSelection();
  const inside = sel.rangeCount && ed.contains(sel.anchorNode);
  const blk = inside ? currentBlock() : '';
  $$('#kRteBar [data-cmd]').forEach(b => {
    let on = false;
    try { on = inside && !/undo|redo|removeFormat/.test(b.dataset.cmd) && document.queryCommandState(b.dataset.cmd); } catch (e) { /* abaikan */ }
    b.classList.toggle('on', !!on);
  });
  $$('#kRteBar [data-block]').forEach(b => b.classList.toggle('on', inside && b.dataset.block !== 'p' && b.dataset.block === blk));
}
function bindRte() {
  const ed = $('#kIsi'), bar = $('#kRteBar');
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* abaikan */ }
  // mousedown + preventDefault agar seleksi teks tidak hilang saat tombol diklik
  bar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cmd) return rteExec(b.dataset.cmd);
    const tag = b.dataset.block;
    rteExec('formatBlock', '<' + (currentBlock() === tag && tag !== 'p' ? 'p' : tag) + '>'); // klik lagi = kembali ke paragraf
  });
  ed.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    e.preventDefault();
    const html = cd.getData('text/html');
    const clean = html ? cleanRich(html) : toRich(cd.getData('text/plain'));
    if (clean) document.execCommand('insertHTML', false, clean);
  });
  ed.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) e.preventDefault(); });
  ed.addEventListener('input', () => { if (!ed.textContent.trim() && !ed.querySelector('li')) ed.innerHTML = ''; updateRteState(); });
  ed.addEventListener('keyup', updateRteState);
  ed.addEventListener('mouseup', updateRteState);
  document.addEventListener('selectionchange', () => { if ($('#mKegiatan').classList.contains('open')) updateRteState(); });
}

function bindDrop(zone, onFiles) {
  ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', e => { if (e.dataTransfer.files.length) onFiles(e.dataTransfer.files); });
}

/* =====================================================================
 *  KAMERA LANGSUNG
 *  - getUserMedia (preview langsung, ganti kamera depan/belakang)
 *  - Cap waktu + nama kegiatan ditanam di foto (bisa dimatikan)
 *  - Bila browser/iframe tidak mengizinkan, fallback ke kamera bawaan perangkat
 * ===================================================================== */
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'];
const CAM = { stream: null, facing: 'environment', shots: [], resolve: null, label: '' };

function stampLines(d) {
  const p = n => ('0' + n).slice(-2);
  return [
    HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear() + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' WIB',
    CAM.label
  ];
}

function openCamera(label) {
  return new Promise(resolve => {
    CAM.resolve = resolve;
    CAM.label = label || '';
    CAM.shots = [];
    renderCamStrip();
    $('#camSub').textContent = 'Kegiatan: ' + (label || '-');
    openModal('mCamera');
    startCamera();
  });
}

async function startCamera() {
  stopCamera();
  $('#camMsg').classList.add('hidden');
  $('#camShot').disabled = true;
  updateStampPreview();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFallback('Browser ini tidak mendukung kamera langsung.');
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: CAM.facing }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false
    });
    const v = $('#camVideo');
    v.srcObject = CAM.stream;
    v.classList.toggle('mirror', CAM.facing === 'user');
    await v.play();
    $('#camShot').disabled = false;
  } catch (e) {
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    camFallback(denied
      ? 'Izin kamera ditolak atau diblokir oleh halaman. Izinkan kamera di pengaturan browser, atau gunakan kamera bawaan perangkat.'
      : 'Kamera tidak ditemukan atau sedang dipakai aplikasi lain.');
  }
}

function camFallback(text) {
  $('#camMsgText').textContent = text;
  $('#camMsg').classList.remove('hidden');
  $('#camShot').disabled = true;
}

function stopCamera() {
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  const v = $('#camVideo'); if (v) v.srcObject = null;
}

function updateStampPreview() {
  const on = $('#camStamp').checked;
  $('#camStampPrev').classList.toggle('hidden', !on);
  if (on) $('#camStampPrev').innerHTML = stampLines(new Date()).filter(Boolean).map(esc).join('<br>');
}

function drawStamp(ctx, w, h) {
  const lines = stampLines(new Date()).filter(Boolean);
  const fs = Math.max(16, Math.round(w / 42));
  const pad = Math.round(fs * 0.9);
  const boxH = lines.length * fs * 1.35 + pad * 1.4;
  const g = ctx.createLinearGradient(0, h - boxH * 1.4, 0, h);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = g; ctx.fillRect(0, h - boxH * 1.4, w, boxH * 1.4);
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'bottom';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
  lines.slice().reverse().forEach((t, i) => {
    ctx.font = (i === lines.length - 1 ? '600 ' : '700 ') + fs + 'px Inter, Arial, sans-serif';
    ctx.fillText(t, pad, h - pad - i * fs * 1.35, w - pad * 2);
  });
  ctx.shadowBlur = 0;
}

function capturePhoto() {
  const v = $('#camVideo');
  if (!v.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  if (CAM.facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, c.width, c.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if ($('#camStamp').checked) drawStamp(ctx, c.width, c.height);
  const fl = $('#camFlash'); fl.classList.add('on'); setTimeout(() => fl.classList.remove('on'), 60);
  c.toBlob(blob => {
    const d = new Date(), p = n => ('0' + n).slice(-2);
    const name = 'Foto_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '_' + (CAM.shots.length + 1) + '.jpg';
    CAM.shots.push(new File([blob], name, { type: 'image/jpeg', lastModified: Date.now() }));
    renderCamStrip();
  }, 'image/jpeg', 0.88);
}

/** Foto dari kamera bawaan perangkat (fallback) juga diberi cap waktu bila aktif. */
function stampFile(file) {
  return new Promise(resolve => {
    if (!$('#camStamp').checked || file.type.indexOf('image/') !== 0) return resolve(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2400, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      drawStamp(ctx, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function renderCamStrip() {
  $$('#camStrip img').forEach(i => URL.revokeObjectURL(i.src));
  $('#camStrip').innerHTML = CAM.shots.map((f, i) =>
    '<div class="cam-th"><img src="' + URL.createObjectURL(f) + '" alt=""><button type="button" data-rm-shot="' + i + '" title="Hapus">' + ic('x', 12) + '</button></div>').join('');
  $$('#camStrip [data-rm-shot]').forEach(b => b.addEventListener('click', () => { CAM.shots.splice(Number(b.dataset.rmShot), 1); renderCamStrip(); }));
  const n = CAM.shots.length;
  $('#camDone').disabled = !n;
  $('#camDone').textContent = n ? 'Gunakan ' + n + ' Foto' : 'Selesai';
}

function finishCamera(useShots) {
  stopCamera();
  $$('#camStrip img').forEach(i => URL.revokeObjectURL(i.src));
  closeModal('mCamera');
  const shots = useShots ? CAM.shots.slice() : [];
  CAM.shots = [];
  if (CAM.resolve) { CAM.resolve(shots); CAM.resolve = null; }
}

function bindCamera() {
  $('#camShot').addEventListener('click', capturePhoto);
  $('#camDone').addEventListener('click', () => finishCamera(true));
  $('#camClose').addEventListener('click', () => finishCamera(CAM.shots.length > 0));
  $('#camSwitch').addEventListener('click', () => { CAM.facing = CAM.facing === 'environment' ? 'user' : 'environment'; startCamera(); });
  $('#camStamp').addEventListener('change', updateStampPreview);
  setInterval(() => { if ($('#mCamera').classList.contains('open')) updateStampPreview(); }, 1000);
  $('#camNative').addEventListener('click', () => pickFiles('#inNativeCam', async files => {
    for (const f of files) CAM.shots.push(await stampFile(f));
    renderCamStrip();
  }));
  document.addEventListener('keydown', e => {
    if (!$('#mCamera').classList.contains('open')) return;
    if (e.key === 'Escape') { e.stopImmediatePropagation(); finishCamera(CAM.shots.length > 0); }
    if (e.key === ' ' && !$('#camShot').disabled) { e.preventDefault(); capturePhoto(); }
  }, true);
}

async function openDetail(id) {
  const rec = findRec(id);
  if (!rec) return;
  S.detail = { record: rec, riwayat: null, files: null };
  renderDrawer();
  openDrawer();
  try {
    const d = await api('getDetail', id);
    if (!S.detail || S.detail.record.id !== id) return;
    S.detail = d; upsert(d.record);
    renderDrawer();
  } catch (e) { toast(e, 'err'); }
}

function imgFallback(img, ext) {
  img.parentNode.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center">' + ic('image', 26) + '<span class="fi-ext">' + esc(ext) + '</span></div>';
}

function ringSvg(p) {
  const C = 2 * Math.PI * 48;
  return '<svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="48" fill="none" stroke="#e8edf4" stroke-width="10"/>' +
    '<circle id="ringArc" cx="56" cy="56" r="48" fill="none" stroke="' + progColor(p) + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - p / 100)) + '"/></svg>';
}

function bindDrawer(k) {
  $('#drClose').addEventListener('click', closeDrawer);
  $('#dEdit').addEventListener('click', () => openForm(findRec(k.id) || k));
  $('#dDelete').addEventListener('click', async () => {
    const ok = await confirmDialog('Hapus kegiatan ini?', '“' + k.kegiatan + '” akan dihapus dari aplikasi dan laporan PDF-nya (berisi semua foto) dipindahkan ke Sampah Drive, masih bisa dipulihkan ±30 hari. File dokumentasi tetap tersimpan di folder Drive.');
    if (!ok) return;
    try {
      await api('deleteKegiatan', k.id);
      S.data = S.data.filter(x => x.id !== k.id);
      closeDrawer(); render();
      toast('Kegiatan dihapus');
    } catch (e) { toast(e, 'err'); }
  });

  // Progres
  const C = 2 * Math.PI * 48;
  const range = $('#dProg'), saveBtn = $('#dSaveProg');
  const preview = v => {
    v = Number(v);
    range.value = v; range.style.setProperty('--v', v + '%');
    const arc = $('#ringArc');
    arc.setAttribute('stroke-dashoffset', C * (1 - v / 100));
    arc.setAttribute('stroke', progColor(v));
    $('#ringVal').textContent = v + '%';
    $('#ringSt').textContent = statusOf(v);
    $$('#dQuick button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === v));
    saveBtn.disabled = v === k.progres && !$('#dNote').value.trim();
  };
  range.style.setProperty('--v', k.progres + '%');
  range.addEventListener('input', () => preview(range.value));
  $('#dQuick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) preview(b.dataset.v); });
  $('#dNote').addEventListener('input', () => preview(range.value));
  saveBtn.addEventListener('click', async () => {
    setBtnBusy(saveBtn, true, 'Menyimpan');
    try {
      let d = await api('updateProgress', k.id, Number(range.value), $('#dNote').value);
      upsert(d.record);
      toast('Progres diperbarui menjadi ' + d.record.progres + '% — menyusun ulang PDF…');
      saveBtn.innerHTML = '<span class="spinner sm"></span> PDF…';
      try { d = await apiDetail('buatLaporanPdf', k.id); } catch (e) { toast('PDF gagal diperbarui: ' + e, 'err'); }
      if (S.detail && S.detail.record.id === k.id) { S.detail = d; renderDrawer(); }
      render();
    } catch (e) { setBtnBusy(saveBtn, false); toast(e, 'err'); }
  });

  // Upload: foto → langsung ke dalam PDF; dokumen/video → folder kegiatan
  const sendNow = async (fileList, kategori) => {
    const items = validFiles(fileList).map(f => ({ file: f, kategori: kategori || guessKategori(f) }));
    if (!items.length) return;
    const box = $('#dUpl');
    $$('#dZone .up-btn').forEach(b => { b.disabled = true; });
    const res = await uploadItems(k.id, items, (i, n, name) => {
      const pct = Math.round(i / n * 100);
      box.innerHTML = '<div class="up-progress"><span><span class="spinner sm"></span> ' +
        (/^menyusun/.test(name) ? 'Menyusun ' + esc(name.replace(/^menyusun /, '')) + '…' : 'Memproses ' + (i + 1) + ' dari ' + n + ': ' + esc(name)) + '</span>' + bar(pct) + '</div>';
    });
    try {
      let d;
      if (res.ok && !res.built) {
        box.innerHTML = '<div class="up-progress"><span><span class="spinner sm"></span> Menyusun laporan PDF…</span></div>';
        d = await apiDetail('buatLaporanPdf', k.id);
      } else d = await apiDetail('getDetail', k.id);
      if (S.detail && S.detail.record.id === k.id) { S.detail = d; renderDrawer(); }
      render();
      if (res.ok) toast(res.ok + ' lampiran ditambahkan · laporan PDF diperbarui');
    } catch (e) { toast(e, 'err'); box.innerHTML = ''; $$('#dZone .up-btn').forEach(b => { b.disabled = false; }); }
  };

  // Perbarui laporan PDF secara manual
  $('#dPdf').addEventListener('click', async () => {
    const b = $('#dPdf');
    setBtnBusy(b, true, 'Menyusun…');
    $('#dPdfInfo').textContent = 'Sedang menyusun PDF (memuat foto bisa memakan waktu)…';
    try {
      const d = await apiDetail('buatLaporanPdf', k.id);
      if (S.detail && S.detail.record.id === k.id) { S.detail = d; renderDrawer(); }
      toast('Laporan PDF berhasil diperbarui');
    } catch (e) { setBtnBusy(b, false); toast(e, 'err'); }
  });
  $('#dCam').addEventListener('click', async () => {
    const shots = await openCamera(k.kegiatan);
    if (shots.length) sendNow(shots, 'dokumentasi');
  });
  $('#dDoc').addEventListener('click', () => pickFiles('#inDoc', f => sendNow(f, 'dokumentasi')));
  $('#dBukti').addEventListener('click', () => pickFiles('#inBukti', f => sendNow(f, 'bukti')));
  bindDrop($('#dZone'), f => sendNow(f));

  $$('#drawer [data-del-file]').forEach(b => b.addEventListener('click', async e => {
    e.preventDefault(); e.stopPropagation();
    const fid = b.dataset.delFile, isFoto = fid.indexOf('foto:') === 0;
    const ok = await confirmDialog(isFoto ? 'Hapus foto ini dari laporan?' : 'Hapus file ini?',
      isFoto ? 'Foto akan dikeluarkan dari laporan PDF. Karena foto hanya tersimpan di dalam PDF, foto ini tidak dapat dikembalikan.'
             : 'File akan dipindahkan ke Sampah Google Drive.');
    if (!ok) return;
    b.disabled = true;
    try {
      toast(isFoto ? 'Menghapus foto & menyusun ulang PDF…' : 'Menghapus file…');
      let d;
      if (isFoto) d = await apiDetail('hapusFotoLaporan', k.id, fid.slice(5));
      else { await api('deleteFile', k.id, fid); d = await apiDetail('buatLaporanPdf', k.id); }
      if (S.detail && S.detail.record.id === k.id) { S.detail = d; renderDrawer(); }
      render();
      toast(isFoto ? 'Foto dihapus dari laporan' : 'File dihapus');
    } catch (err) { b.disabled = false; toast(err, 'err'); }
  }));
}
</script>
